[package]
name = "engram-cache"
version = "0.1.1"
edition = "2021"
description = "An asynchronous, multi-tier cache backed by Moka and SQLite"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Izyawastaken/engram"
documentation = "https://docs.rs/engram-cache"
homepage = "https://github.com/Izyawastaken/engram"
keywords = ["cache", "sqlite", "moka", "async", "zstd"]
categories = ["asynchronous", "caching", "database"]
rust-version = "1.70"
exclude = ["demo/**"]

[lib]
name = "engram"

[dependencies]
bincode = "1.3"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
